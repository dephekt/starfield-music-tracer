name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: stackdrift
    container:
      image: python:3.12-bookworm
      volumes:
        - /mnt/data/starfield:/starfield:ro
    env:
      STARFIELD_DATA: /starfield/Data
      OST_DIR: /starfield/Music
    steps:
      - name: Install system deps
        run: >-
          apt-get update && apt-get install -y -q
          libchromaprint-tools libvorbisfile3 ffmpeg opus-tools
          openssh-client git nodejs

      - uses: actions/checkout@v4

      - name: Install Python deps
        run: pip install uv && uv sync --frozen --extra fingerprint --extra freeze

      - name: Run extraction
        run: uv run python extract.py

      - name: Run fingerprinting
        run: uv run python fingerprint.py
        env:
          LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libvorbisfile.so.3

      - name: Freeze static site
        run: uv run python freeze.py
        env:
          SITE_BASE_PATH: /starfield-music-tracer

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://${{ forge.repository_owner }}.codeberg.page/starfield-music-tracer/"
          token: ${{ forge.token }}
          source: _site/

      - name: Deploy to Upsun
        run: |
          set -ex
          mkdir -p ~/.ssh
          echo "${{ secrets.UPSUN_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 git.eu-3.platform.sh >> ~/.ssh/known_hosts 2>/dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.email "ci@stackdrift.org"
          git config user.name "Codeberg CI"
          git add -f data/starfield_music.db static/clips/
          git commit -m "chore(ci): rebuild database and audio clips"
          git remote add upsun vlhc3m5ztrnd2@git.eu-3.platform.sh:vlhc3m5ztrnd2.git
          git push --force upsun HEAD:main
